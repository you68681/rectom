[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rectom"
version = "0.1.0"
description = "Official RecToM implementation for recursive Theory-of-Mind reasoning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0.0",
  "openai>=1.40.0",
  "pandas>=2.0.0",
]

[project.scripts]
rectom = "rectom.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
